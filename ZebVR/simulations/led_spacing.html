<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Hotspot Visualizer (Polynomial Power Profiling)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121214;
            color: #e4e4e7;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background-color: #1c1c1f;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #ffffff; }
        .control-group {
            margin-bottom: 16px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            color: #a1a1aa;
        }
        label span { font-weight: bold; color: #38bdf8; }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }
        canvas {
            background-color: #09090b;
            border-radius: 8px;
            display: block;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LED Hotspot Visualizer</h2>
    
    <div class="control-group">
        <label>Number of LEDs: <span id="count-val">9</span></label>
        <input type="range" id="ledCount" min="1" max="31" step="2" value="9">
    </div>

    <div class="control-group">
        <label>LED Spacing: <span id="spacing-val">30</span>mm</label>
        <input type="range" id="spacing" min="5" max="100" step="0.5" value="30">
    </div>

    <div class="control-group">
        <label>Diffuser Depth: <span id="depth-val">30</span>mm</label>
        <input type="range" id="depth" min="5" max="100" step="5" value="30">
    </div>

    <div class="control-group">
        <label>Beam Angle (FWHM): <span id="angle-val">120</span>°</label>
        <input type="range" id="angle" min="30" max="140" step="5" value="120">
    </div>

    <div class="control-group">
        <label>Base LED Power: <span id="exposure-val">1.0</span>x</label>
        <input type="range" id="exposure" min="0.1" max="5.0" step="0.05" value="1.0">
    </div>

    <div class="control-group">
        <label>Edge Power Curve (Polynomial): <span id="curve-val">0.00</span></label>
        <input type="range" id="edgeCurve" min="-2.0" max="2.0" step="0.05" value="0.00">
    </div>

    <canvas id="simCanvas" width="650" height="480"></canvas>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const elCount = document.getElementById('ledCount');
const elSpacing = document.getElementById('spacing');
const elDepth = document.getElementById('depth');
const elAngle = document.getElementById('angle');
const elExposure = document.getElementById('exposure');
const elEdgeCurve = document.getElementById('edgeCurve');

function getLambertianIntensity(thetaRad, fwhmAngleDeg) {
    const halfFwhmRad = (fwhmAngleDeg / 2) * (Math.PI / 180);
    const m = Math.log(0.5) / Math.log(Math.cos(halfFwhmRad));
    if (Math.abs(thetaRad) >= Math.PI / 2) return 0;
    const energyNormalization = (m + 1) / 2;
    return Math.pow(Math.cos(thetaRad), m) * energyNormalization;
}

function drawSimulation() {
    const count = parseInt(elCount.value);
    const spacing = parseFloat(elSpacing.value);
    const depth = parseInt(elDepth.value);
    const angle = parseInt(elAngle.value);
    const exposure = parseFloat(elExposure.value);
    const edgeCurve = parseFloat(elEdgeCurve.value);

    document.getElementById('count-val').textContent = count;
    document.getElementById('spacing-val').textContent = spacing;
    document.getElementById('depth-val').textContent = depth;
    document.getElementById('angle-val').textContent = angle;
    document.getElementById('exposure-val').textContent = exposure.toFixed(2);
    document.getElementById('curve-val').textContent = edgeCurve.toFixed(2);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scale = 2.5; 
    const frontPanelY = 35;
    const frontPanelHeight = 80;
    const centerYRow = Math.floor(frontPanelHeight / 2);
    
    const groundY = canvas.height - 30;
    const diffuserY = groundY - (depth * scale);
    const centerX = canvas.width / 2;

    // Build the array of structured LED objects with distinct polynomial scales
    const leds = [];
    const startX = centerX - (Math.floor(count / 2) * spacing * scale);
    for(let i = 0; i < count; i++) {
        // Map LED index smoothly from -1.0 (leftmost edge) to +1.0 (rightmost edge)
        const xNormalized = count > 1 ? (i / (count - 1)) * 2 - 1 : 0;
        
        // Compute second-order polynomial power output: P = 1 + c * x^2
        const individualPower = 1.0 + edgeCurve * (xNormalized * xNormalized);

        leds.push({
            lx: startX + (i * spacing * scale),
            power: Math.max(0, individualPower) // Guard against negative power
        });
    }

    const airTopY = Math.floor(diffuserY);
    const airBottomY = Math.floor(groundY);
    
    // 1. Per-Pixel Air Field Ray Calculation
    for (let px = 0; px < canvas.width; px += 2) {
        for (let py = airTopY; py < airBottomY; py += 2) {
            let totalAirIntensity = 0;
            const sampleX = px + 1;
            const sampleY = py + 1;

            leds.forEach(led => {
                const distX_MM = Math.abs(sampleX - led.lx) / scale;
                const distY_MM = Math.abs(groundY - sampleY) / scale;
                const theta = Math.atan2(distX_MM, distY_MM);
                const hypMM = Math.sqrt((distX_MM * distX_MM) + (distY_MM * distY_MM));
                
                if (hypMM > 0.5) {
                    const lambertFactor = getLambertianIntensity(theta, angle);
                    // Scale local contribution by specific LED power parameter
                    totalAirIntensity += (lambertFactor / (hypMM * hypMM)) * led.power;
                }
            });
            
            const exposedAirValue = totalAirIntensity * 120 * exposure;
            const alphaAir = Math.min(1.0, Math.pow(exposedAirValue, 0.85)); 
            
            if (alphaAir > 0.005) {
                ctx.fillStyle = `rgba(56, 189, 248, ${alphaAir})`;
                ctx.fillRect(px, py, 2, 2);
            }
        }
    }

    // 2. Diffuser Surface Math Pass
    const matrix2DValues = [];
    const physicsNormalizationFactor = 250;

    for (let px = 0; px < canvas.width; px++) {
        matrix2DValues[px] = new Array(frontPanelHeight).fill(0);
        
        for (let py = 0; py < frontPanelHeight; py++) {
            const distFromCenterY_MM = Math.abs(py - centerYRow) / scale;
            let absolutePixelLight = 0;
            
            leds.forEach(led => {
                const distX_MM = Math.abs(px - led.lx) / scale;
                const radialDistMM = Math.sqrt((distX_MM * distX_MM) + (distFromCenterY_MM * distFromCenterY_MM));
                
                const theta = Math.atan2(radialDistMM, depth);
                const hypMM = Math.sqrt((radialDistMM * radialDistMM) + (depth * depth));
                
                if (hypMM > 0.5) {
                    const lambertFactor = getLambertianIntensity(theta, angle);
                    // Scale local contribution by specific LED power parameter
                    absolutePixelLight += (lambertFactor / (hypMM * hypMM)) * led.power;
                }
            });

            matrix2DValues[px][py] = absolutePixelLight * physicsNormalizationFactor * exposure;
        }
    }

    // 3. Render Simulated Front-Facing 2D View
    for (let px = 0; px < canvas.width; px++) {
        for (let py = 0; py < frontPanelHeight; py++) {
            const intensity = matrix2DValues[px][py];
            const alpha2D = Math.min(1.0, Math.pow(intensity, 0.95));

            if (alpha2D > 0) {
                ctx.fillStyle = `rgba(14, 165, 233, ${alpha2D})`;
                ctx.fillRect(px, frontPanelY + py, 1, 1);
            }
        }
    }

    // Front View Window Outline
    ctx.fillStyle = '#a1a1aa';
    ctx.font = '14px sans-serif';
    ctx.fillText('Front View', 15, frontPanelY - 10);
    ctx.strokeStyle = 'rgba(228, 228, 231, 0.1)';
    ctx.strokeRect(0, frontPanelY, canvas.width, frontPanelHeight);

    // 4. Render Side Profile Slice Using the Matrix's Central Row Row Snapshot
    const profileGlowHalfHeight = 8; 
    
    for (let px = 0; px < canvas.width; px++) {
        const sliceIntensity = matrix2DValues[px][centerYRow];
        const alphaSide = Math.min(1.0, Math.pow(sliceIntensity, 0.95));

        if (alphaSide > 0) {
            ctx.fillStyle = `rgba(14, 165, 233, ${alphaSide})`;
            ctx.fillRect(px, diffuserY - profileGlowHalfHeight, 1, profileGlowHalfHeight * 2);
        }
    }

    // Structural Reference Guideline
    ctx.strokeStyle = 'rgba(228, 228, 231, 0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, diffuserY);
    ctx.lineTo(canvas.width, diffuserY);
    ctx.stroke();

    ctx.fillStyle = '#a1a1aa';
    ctx.fillText('Side View', 15, diffuserY - 16);

    // 5. Draw Physical LED Chips
    leds.forEach(led => {
        ctx.fillStyle = '#f59e0b'; 
        ctx.fillRect(led.lx - 5, groundY - 2, 10, 4);
    });
}

[elCount, elSpacing, elDepth, elAngle, elExposure, elEdgeCurve].forEach(input => {
    input.addEventListener('input', drawSimulation);
});

drawSimulation();
</script>

</body>
</html>
